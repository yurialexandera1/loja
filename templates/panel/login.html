{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Painel Case See</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="{% static 'store/css/loja.css' %}">
</head>
<body>
<div class="plogin">
  <div class="panel">
    <div class="logo" style="margin-bottom:22px"><img src="{% static 'store/img/logo.png' %}" alt="Case See" class="mk"><span><b>Case See</b><small>Painel</small></span></div>
    {% if form.non_field_errors %}
      <div class="alert warn" role="alert" style="margin-bottom:16px">{{ form.non_field_errors }}</div>
    {% endif %}
    <form method="post" class="fieldgrid" style="grid-template-columns:1fr">
      {% csrf_token %}
      <div class="field"><label for="{{ form.username.id_for_label }}">Usuário</label>{{ form.username }}</div>
      <div class="field"><label for="{{ form.password.id_for_label }}">Senha</label>{{ form.password }}</div>
      <button class="btn primary wide" type="submit" style="margin-top:6px">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>

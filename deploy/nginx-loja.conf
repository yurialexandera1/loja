server {
    listen 9000;
    server_name 45.231.36.139 loja.exemplo.com;
    client_max_body_size 10M;
    location /static/ { alias /home/yuri/loja_django/staticfiles/; }
    location /media/ { alias /home/yuri/loja_django/media/; }
    location / {
        proxy_pass http://unix:/run/loja.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
